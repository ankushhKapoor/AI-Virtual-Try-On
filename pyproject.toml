[project]
name = "ai-virtual-try-on"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "av>=18.1.0",
    "cloudpickle>=3.1.2",
    "diffusers>=0.39.0",
    "fvcore>=0.1.5.post20221221",
    "ftfy>=6.3.1",
    "gradio>=6.24.0",
    "huggingface-hub>=1.28.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "omegaconf>=2.3.1",
    "open-clip-torch>=2.32.0",
    "opencv-python>=5.0.0.93",
    "peft>=0.20.0",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
    # Model API service dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings",
    "sqlalchemy",
    "dotenv",
    # Database, authentication, migrations, and API utilities used by app/.
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pymysql>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
]


[tool.setuptools.packages.find]
include = ["ai*", "app*", "backend*", "dwm*", "model_api*"]
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = true
