[project]
name = "ai-virtual-try-on"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "av>=18.1.0",
    "cloudpickle>=3.1.2",
    "diffusers>=0.39.0",
    "fvcore>=0.1.5.post20221221",
    "huggingface-hub>=1.28.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "peft>=0.20.0",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
